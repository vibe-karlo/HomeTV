<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeTV">
  <title>HomeTV Remote</title>
  <!-- Added to the home screen it opens as its own app, full screen, with this icon. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <main id="remote">
    <header id="bar">
      <div id="now">
        <b id="now-app">Philips TV</b>
        <span id="now-what">Connecting</span>
      </div>
      <button id="amb-open" class="round" aria-label="Ambilight"></button>
      <button id="apps-open" class="round" aria-label="Apps"></button>
      <button id="kbd-open" class="round" aria-label="Type on the TV"></button>
      <button id="power" class="round" aria-label="Turn the TV off"></button>
    </header>

    <!-- What is playing, from the app's media session, with the controls the app offers. -->
    <section id="playing" aria-label="Now playing" hidden>
      <div id="pl-top">
        <i id="pl-art"></i>
        <div id="pl-text"><b id="pl-title"></b><span id="pl-sub"></span></div>
      </div>
      <div id="pl-bar">
        <span id="pl-track"><i id="pl-fill"></i></span>
        <span id="pl-times"><span id="pl-at"></span><span id="pl-left"></span></span>
      </div>
      <div id="pl-ctl">
        <button data-media="previous" aria-label="Previous"></button>
        <button data-media="back" aria-label="Back 10 seconds"></button>
        <button data-media="toggle" id="pl-toggle" aria-label="Play or pause"></button>
        <button data-media="forward" aria-label="Forward 10 seconds"></button>
        <button data-media="next" aria-label="Next"></button>
      </div>
    </section>

    <section id="pad" aria-label="Touch pad: swipe to move, tap to select">
      <span id="pad-touch"></span>
      <span id="pad-hint">Swipe to move · Tap to select</span>
    </section>

    <!-- Only while a live TV app is in front (MAXtv, EON, Watch TV): one rocker, like the TV's own remote. -->
    <section id="chan" aria-label="Channel" hidden>
      <button data-key="channel_down" aria-label="Channel down"></button>
      <span>Channel</span>
      <button data-key="channel_up" aria-label="Channel up"></button>
    </section>

    <section id="keys">
      <button data-key="back" aria-label="Back"></button>
      <button data-key="home" aria-label="Home"></button>
      <button data-key="play_pause" aria-label="Play or pause"></button>
      <button data-vol="mute" aria-label="Mute"></button>
      <button data-vol="down" aria-label="Volume down"></button>
      <button data-vol="up" aria-label="Volume up"></button>
    </section>
  </main>

  <section id="kbd" aria-label="Type on the TV" aria-hidden="true">
    <div id="kbd-sheet">
      <div id="kbd-top">
        <span id="kbd-title">Typing on the TV</span>
        <button id="kbd-done">Done</button>
      </div>
      <input id="kbd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
        enterkeyhint="search" placeholder="Tap here to type">
    </div>
  </section>

  <section id="apps" aria-label="Apps" aria-hidden="true">
    <div id="apps-sheet">
      <div id="apps-top"><span>Apps</span><button id="apps-done">Done</button></div>
      <div id="apps-grid"></div>
      <div id="inputs-top">Inputs</div>
      <div id="inputs-list"></div>
    </div>
  </section>

  <section id="amb" class="sheet" aria-label="Ambilight" aria-hidden="true">
    <div class="sheet-in">
      <div class="sheet-top"><span>Ambilight</span><button id="amb-done" class="sheet-done">Done</button></div>
      <div id="amb-body"></div>
    </div>
  </section>

  <section id="pair" hidden>
    <h1>Pair this phone</h1>
    <p>Type the 6-digit code shown on the TV.</p>
    <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Pairing code">
    <div id="pair-boxes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p id="pair-msg" role="status"></p>
  </section>

  <div id="toast" role="status"></div>
  <script src="remote.js"></script>
</body>
</html>
